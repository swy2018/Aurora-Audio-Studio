name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-regression:
    name: Verify Mac runtime lifecycle on POSIX
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install test dependencies only
        run: python -m pip install filelock==4.0.7 huggingface_hub==1.33.0 tqdm==4.70.1
      - name: Environment and model lifecycle regression
        working-directory: work/audio-studio/AuroraAudioStudio.Mac/Runtime
        run: python -B -m unittest test_environment test_lifecycle

  build:
    name: Build unsigned Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw 'work/audio-studio/AuroraAudioStudio/AuroraAudioStudio.csproj'
          $versionGroup = $project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1
          $version = [string]$versionGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Unable to read the application version from AuroraAudioStudio.csproj.'
          }
          "AURORA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore work/audio-studio/AuroraAudioStudio/AuroraAudioStudio.csproj --runtime win-x64 -p:PublishReadyToRun=true

      - name: Build
        run: dotnet build work/audio-studio/AuroraAudioStudio/AuroraAudioStudio.csproj --configuration Release --no-restore -p:Platform=x64 -p:ContinuousIntegrationBuild=true

      - name: Run regression checks
        run: dotnet run --project work/audio-studio/AuroraAudioStudio.UpdateFlowTests/AuroraAudioStudio.UpdateFlowTests.csproj --configuration Release -- work/audio-studio/AuroraAudioStudio.iss

      - name: Verify behavior, localization, and published catalog
        shell: pwsh
        run: |
          dotnet run --project work/audio-studio/AuroraAudioStudio.BehaviorTests --configuration Release
          if ($LASTEXITCODE) { throw 'Behavior checks failed.' }
          dotnet run --project work/audio-studio/AuroraAudioStudio.BehaviorTests --configuration Release --no-build -- --strings .
          if ($LASTEXITCODE) { throw 'Localization checks failed.' }
          dotnet run --project work/audio-studio/AuroraAudioStudio.BehaviorTests --configuration Release --no-build -- --catalog . --check
          if ($LASTEXITCODE) { throw 'Published capability matrix is stale.' }
          & ./work/audio-studio/tools/sync-release.ps1 -Check
          node ./work/audio-studio/tools/test-release-policy.mjs
          if ($LASTEXITCODE) { throw 'Website release-policy checks failed.' }

      - name: Publish application
        run: dotnet publish work/audio-studio/AuroraAudioStudio/AuroraAudioStudio.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:Platform=x64 -p:PublishSingleFile=false -p:ContinuousIntegrationBuild=true --output publish/ci-app

      - name: Verify shared Mac behavior without native Mac claims
        run: dotnet run --project work/audio-studio/AuroraAudioStudio.MacTests --configuration Release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          & $iscc "/DMyAppVersion=$env:AURORA_VERSION" '/DPublishFolder=ci-app' '/DInstallerFolder=ci-installer' "/DInstallerBaseName=Aurora-Audio-Studio-$env:AURORA_VERSION-Setup-x64" 'work/audio-studio/AuroraAudioStudio.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Verify installed application launch
        shell: pwsh
        run: |
          & ./work/audio-studio/tools/Test-InstalledApp.ps1 -Installer "publish/ci-installer/Aurora-Audio-Studio-$env:AURORA_VERSION-Setup-x64.exe" -EvidenceRoot "$env:RUNNER_TEMP/Aurora-installed-acceptance"

      - name: Verify uninstall preserves nested user data
        shell: pwsh
        run: |
          & ./work/audio-studio/tools/Test-UninstallRetention.ps1 -AcceptanceRoot "$env:RUNNER_TEMP/Aurora-installed-acceptance"

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = "publish/ci-installer/Aurora-Audio-Studio-$env:AURORA_VERSION-Setup-x64.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer was not created: $installer"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -Encoding ascii "$installer.sha256"

      - name: Upload unsigned build artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: Aurora-Audio-Studio-${{ steps.version.outputs.version }}-unsigned
          path: |
            publish/ci-installer/*.exe
            publish/ci-installer/*.sha256
          if-no-files-found: error
          retention-days: 14

      # After the SignPath Foundation application is approved, the signing
      # request action will consume upload-unsigned-artifact.outputs.artifact-id.

